[project]
name = "nonebot-plugin-group-chat-memory"
version = "0.1.0"
description = "为 NoneBot2 群聊提供共享长期记忆、点名对话和按群概率回复"
authors = [{ name = "TonyLiangP2010405" }]
license = "MIT"
requires-python = ">=3.10,<4.0"
keywords = ["nonebot", "nonebot2", "onebot", "group", "memory", "embedding"]
dependencies = [
    "nonebot2>=2.2.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.0,<3.0.0",
    "nonebot-plugin-localstore>=0.7.0,<1.0.0",
    "pydantic>=2.0,<3.0",
    "aiosqlite>=0.19",
    "sqlite-vec>=0.1.6,<0.2.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/TonyLiangP2010405/nonebot-plugin-group-chat-memory"
Repository = "https://github.com/TonyLiangP2010405/nonebot-plugin-group-chat-memory"

[tool.poetry]
packages = [{ include = "nonebot_plugin_group_chat_memory" }]

[tool.poetry.group.dev.dependencies]
nonebug = ">=0.3"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
respx = ">=0.21"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.nonebot]
plugins = ["nonebot_plugin_group_chat_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]
